<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>Post Edit</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    body {background-color: gray;}
    
    table, th, td, caption {border:1px solid black; background-color: white; font-size: 20px;}

    .newInfo {background-color: rgb(127, 255, 127);}

    .tableInput {font-size: 20px;}

    th {width: 30%;}

    .tableInput:hover {background-color: #D6EEEE;}

    label, input {font-size: 25px;}
    button, ul {font-size: 20px;}
</style>

<!--
Called from songView.

Should be accessible to moderators only.

Displays the post's information on the left and then inputs for changing the information on the the middle
On the right, shows examples of how it works
-->

<script defer>

    let oldTags = new Array()
    let tagNames = new Array()
    let songID

    /**
     * Gets the Song ID (AKA Post ID) from the end of the page's URL and returns it.
    **/
    function getPostID() {
        const URL = window.location.href
        const endPoint = URL.lastIndexOf("/")

        return URL.slice(endPoint + 1, URL.length)
    }


    function loadPostData(){
        fetch("http://localhost:3000/api/post/" + songID)
        .then(response => response.json())
        .then(json => {
            songData = json

            const songName = document.createTextNode(songData.songName)
            const link = document.createTextNode(songData.link)

            const input = document.createElement("input")

            input.className = "tableInput"

            const input2 = input.cloneNode()

            input.value = songData.songName
            input2.value = songData.link

            input.id = "SongNameInput"
            input2.id = "YoutubeIDInput"

            document.getElementById("currentSongName").append(songName)
            document.getElementById("newSongName").append(input)

            document.getElementById("currentYoutubeID").append(link)
            document.getElementById("newYoutubeID").append(input2)
        });
    }


    function loadTag(tagID){

        fetch("http://localhost:3000/api/tags/" + tagID)
        .then(response => response.json())
        .then(json => {

            const tagName = json.tagName
            oldTags.push(tagName)

            let type

            switch(json.type) {
                case 0:
                    type = "artistTags"
                    break
                case 1:
                    type = "genreTags"
                    break
                case 2:
                    type = "miscTags"
                    break
                default:
                    type = "miscTags"
            }

            createTagTableRow(type, tagName, false)
        })

    }


    function createTagTableRow(type, tagName, isNewTag){

        const table = document.getElementById(type)
        const tableRow = document.createElement("tr")
        const currentTag = document.createElement("td")
        const oldTag = document.createElement("td")

        const text = document.createTextNode(tagName)
        const empty = document.createTextNode(" ")

        const input = document.createElement("input")

        input.className = "tableInput"
        input.name = "newTag"

        oldTag.append(text)

        if (isNewTag) {
            input.value = ""
        }
        else {
            input.value = tagName
        }

        currentTag.append(input)
        tableRow.append(oldTag, currentTag)
        table.append(tableRow)                    
    }


    function loadPage(){

        songID = getPostID()

        loadPostData(songID)

        fetch("http://localhost:3000/api/postTags/" + songID)
        .then(response => response.json())
        .then(json => {

            let tagIDs = new Array()

            for (let i = 0; i < json.length; i++){
                tagIDs.push(json[i].tagID)
            }

            for (let i = 0; i < tagIDs.length; i++){
                loadTag(tagIDs[i])
            }
        })
        
    }


    function submit(){
        const songName = document.getElementById("SongNameInput").value
        const link = document.getElementById("YoutubeIDInput").value
        const newTags = document.getElementsByName("newTag")

        for (let i = 0; i < newTags.length; i++) {
            if(newTags[i].value != ""){
                tagNames.push(newTags[i].value)
            }
        }

        // Updates the song and link
        fetch("http://localhost:3000/api/updatePost/" + songID, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "authorization": localStorage.getItem("sessionID") //sent authorization to the server so it knows we're logged in
            },
            body: JSON.stringify({
                data: {
                    songName: songName,
                    link: link
                }
            })
        })

        if (tagsHaventChanged(tagNames)) {
            tagNames = []
            return
        }

        fetch("http://localhost:3000/api/updatePostTags/" + songID, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "authorization": localStorage.getItem("sessionID") //sent authorization to the server so it knows we're logged in
            },
            body: JSON.stringify({
                data: {
                    tags : tagNames
                }
            })
        })

        tagNames = []
    }


    function tagsHaventChanged(tagNames){
        if (oldTags.length != tagNames.length){
            return false
        }

        for(let i = 0; i < oldTags.length; i++){
            if (oldTags[i] != tagNames[i]){
                return false
            }
        }

        return true
    }

    /*
      For debugging purposes. Doesn't need to actually exist.
    */
    function printCurrentData(){
        fetch("http://localhost:3000/api/postTags/" + songID)
        .then(response => response.json())
        .then(json => {
            console.log(json)
        })
    }

</script>

<body onload = "loadPage()">

    <br>
    <table style = "font-size: 20px; width: 45%;">
        <caption>SONG INFORMATION</caption>
        <tr>
            <th> </th> <!--Don't delete. It is needed for the formatting.-->
            <th>Current Data</th>
            <th>New Data</th>
        </tr>
        <tr>
            <th>Song Name</th>
            <td id = "currentSongName"></td>
            <td id = "newSongName"></td>
        </tr>
        <tr>
            <th>Youtube ID / Link</th>
            <td id = "currentYoutubeID"></td>
            <td id = "newYoutubeID"></td>
        </tr>
    </table>
    <br>

    <!--Make a scrollable list containing all of three versions of the tags.-->

    <div style = "display: flex;">

        <div style = "width: 25%;">

            <table id = "artistTags" style = "font-size: 20px;">
                <caption>ARTIST TAGS</caption>
                <tr>
                    <th>Current Data</th>
                    <th>New Data</th>
                </tr>
            </table> <br>

            <button onclick = "createTagTableRow('artistTags', 'NO DATA', true)">Add Artist Tag</button>

        </div>

        <div style = "width: 25%;">

            <table id = "genreTags" style = "font-size: 20px;">
                <caption>GENRE TAGS</caption>
                <tr>
                    <th>Current Data</th>
                    <th>New Data</th>
                </tr>
            </table> <br>

            <button onclick = "createTagTableRow('genreTags', 'NO DATA', true)">Add Genre Tag</button>

        </div>

        <div style = "width: 25%;">

            <table id = "miscTags" style = "font-size: 20px;">
                <caption>MISC TAGS</caption>
                <tr>
                    <th>Current Data</th>
                    <th>New Data</th>
                </tr>
            </table> <br>

            <button onclick = "createTagTableRow('miscTags', 'NO DATA', true)">Add Misc Tag</button>

        </div>

    </div>

    <button onclick = "submit()">Submit</button>
    <button onclick = "printCurrentData()">Print Current Data</button>
    <br><br>
    <label>(To delete a tag, make its new data empty.)</label><br>
    <label>(Additionally, the tag type doesn't actually matter. It's just there for visuals.)</label><br>

</body>
