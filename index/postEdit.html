-->

<script defer>

    /**
     * Gets the Song ID (AKA Post ID) from the end of the page's URL and returns it.
    **/
    function getPostID() {
        const URL = window.location.href
        const endPoint = URL.lastIndexOf("/")

        return URL.slice(endPoint + 1, URL.length)
    }

</script>
