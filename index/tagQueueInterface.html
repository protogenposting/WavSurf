<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Tag Queue Interface</title>
    
</head>

<script>
    //queue array that stores the queue data
    var queue = []
    let popup = document.getElementById("popup");

    /**
     * Gets the information from the tagQueue and displayes it on the page.
     * Stores the information in the queue array.
     * If the user is not a high enough rank or is not logged in
     * they get redirected to the login page.
    **/
    function getInfo() {
        fetch("http://localhost:3000/api/tagQueue")
        .then(response => response.json())
        .then(json => {
            queue = json;
            document.getElementById('p1').innerHTML = JSON.stringify(json[0]);
            console.log(json);
        });
        
        if (localStorage.getItem("username") == undefined) {
            window.location.href = "http://localhost:3000/noAccess"
            document.body.innerHTML = ""
        }
        fetch("http://localhost:3000/api/user/"+localStorage.getItem("username"))
        .then(response => response.json())
        .then(json => {
            if (json.user.rank < 2) {
                window.location.href = "http://localhost:3000/noAccess"
                document.body.innerHTML = ""
            }
            console.log(json)
            console.log(json.user.rank)
        });

    }

    /**
     * When called it accepts the first bit of data in the queue array to be moved on into the main table.
     * Then deletes it from the tagQueue.
    **/
    function accept() {
        fetch("http://localhost:3000/api/acceptTag/" + queue[0].id, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "authorization": localStorage.getItem("sessionID")
            },
        })
        .then(getInfo())
        
    }

    /**
     * When called it denies the first bit of data in the queue array and deletes it from the tagQueue.
    **/
    function deny() {
        fetch("http://localhost:3000/api/denyTag/" + queue[0].id, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "authorization": localStorage.getItem("sessionID")
            },
        })
        .then(getInfo())
        
    }
</script>

<!--Runs the getInfo() function when the page is loaded-->
<body onload = "getInfo()">

    <!--When clicked runs the accept() function-->
    <button type = "button" onclick="accept()">Accept</button><br>

    <!--When clicked runs the deny() function-->
    <button type = "button" onclick="deny()">Deny</button><br>

    <label id ="popup"></label>

    <!--Displayes the first bit of tagQueue data on the page-->
    <p id = "p1">placeholder</p>

</body>

</html>
