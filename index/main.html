<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>Main Page</title>
</head>

<body style = "align-items: center; background-color: gray; position: absolute; left: 50px; top: 50px;" onload = "load()">

    <input
        type = "text"
        id = "searchBar"
        style = "font-size: 20px;"
        placeholder = 'Song Name "Tag Name"'
    ><br>

    <button
        type = "button"
        id = "search"
        onclick = "search()"
        style = "top: 120px; font-size: 20px;">Search
    </button><br><br>

    <button
        type = "button"
        id = "login"
        style = "top: 120px; font-size: 20px;">Login
    </button><br><br>

    <button
        type = "button"
        id = "signUp"
        style = "top: 120px; font-size: 20px;">Sign Up
    </button><br><br>

    <button
        type = "button"
        id = "postCreate"
        style = "top: 120px; font-size: 20px;">Create Post
    </button><br><br>

    <button
        type = "button"
        id = "tagCreate"
        style = "top: 120px; font-size: 20px;">Create Tag
    </button><br><br>

</body>

<script defer type = "text/javascript">
    
    /**
     * Goes to the search page with the stuff the user entered. Or whatever Carson wanted lol
    **/
    function search(){

        const searchText = document.getElementById("searchBar").value
        console.log(searchText)

        let URL = "http://localhost:3000/search"

        if (!(searchText == "")){
            URL += "/"
        }

        location.href = URL + searchText
    }

    /**
     * Loads all of the URLs the buttons will go to.
     * Put in a function because inlining it looks kinda ugly
    **/
    function load(){
        document.getElementById("login").onclick = function () {
            location.href = "http://localhost:3000/login";
        };

        document.getElementById("signUp").onclick = function () {
            location.href = "http://localhost:3000/signUp";
        };

        document.getElementById("postCreate").onclick = function () {
            location.href = "http://localhost:3000/postCreate";
        };

        document.getElementById("tagCreate").onclick = function () {
            location.href = "http://localhost:3000/tagCreate";
        };
    }
    
</script>

</html>
