<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>Main Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload = "load()">
    
    <input
        type = "text"
        id = "searchBar"
        style = "top: 55px; font-size: 35px;"
        placeholder = 'Song Name "Tag Name"'
    >

    <button
        type = "button"
        id = "search"
        onclick = "search()"
        style = "top: 120px; font-size: 30px;">Search
    </button>

    <button
        type = "button"
        id = "login"
        style = "top: 180px; font-size: 30px;">Login
    </button>

    <button
        type = "button"
        id = "signUp"
        style = "top: 240px; font-size: 30px;">Sign Up
    </button>

    <button
        type = "button"
        id = "postCreate"
        style = "top: 300px; font-size: 30px;">Create Post
    </button>

    <button
        type = "button"
        id = "tagCreate"
        style = "top: 360px; font-size: 30px;">Create Tag
    </button>

</body>

<script defer type = "text/javascript">
    
    /**
     * Goes to the search page with the stuff the user entered.
    **/
    function search(){

        const searchText = document.getElementById("searchBar").value

        let URL = "http://localhost:3000/search"

        if (!(searchText == "")){
            URL += "/"
        }

        location.href = URL + searchText
    }

    /**
     * Loads all of the URLs the buttons will go to.
     * Put in a function because inlining it looks kinda ugly
    **/
    function load(){
        document.getElementById("login").onclick = function () {
            location.href = "http://localhost:3000/login";
        };

        document.getElementById("signUp").onclick = function () {
            location.href = "http://localhost:3000/signUp";
        };

        document.getElementById("postCreate").onclick = function () {
            location.href = "http://localhost:3000/postCreate";
        };

        document.getElementById("tagCreate").onclick = function () {
            location.href = "http://localhost:3000/tagCreate";
        };
    }
    
</script>

</html>
