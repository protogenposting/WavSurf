<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Post Search</title>
    <link rel="stylesheet" href="style.css">
</head>

<script>
    var posts = []

    fetch("http://localhost:3000/api/posts")
    .then(response => response.json())
    .then(json => {
        posts = json;
        document.getElementById('posts').innerHTML = JSON.stringify(json);
        console.log(json);
    });

</script>

<p id = "posts"></p>
</html>
