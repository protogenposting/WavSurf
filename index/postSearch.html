<!DOCTYPE html>
<html lang = "en">

<script>
    var posts = []

    fetch("http://localhost:3000/api/posts")
    .then(response => response.json())
    .then(json => {
        posts = json;
        document.getElementById('posts').innerHTML = JSON.stringify(json);
        console.log(json);
    });

</script>

<p id = "posts"></p>
</html>
