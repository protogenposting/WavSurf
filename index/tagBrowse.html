<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Tag Browsing Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<script defer>
    let tagsToCheck = [] //the tags to use in nextTag
    let currentTag = 0  //the current tag we're checking and adding to the list
    let buttonSpacing = 10

    /**
     * Gets the ids of all parent tags, aka tags with no parents of their own
     */
    function getParents() {
        fetch("http://localhost:3000/api/tagParents")
        .then(response => response.json())
        .then(json => {
            const tags = json

            for (let i = 0; i < tags.length; i++){
                tags[i].layer = 0
                tags[i].depth = 0
                tagsToCheck.push(tags[i])
            }

            nextTag()

        });
    }

    /**
     * Adds the children of the next tag and adds a button for it to the list
     */
    function nextTag(){
        buttonSpacing += 10;
        let tag = tagsToCheck[currentTag]

        let hyperLink = document.createElement("a")
        let newButton = document.createElement("button")
        let lineBreak = document.createElement("br")

        hyperLink.href = "http://localhost:3000/search/" + '"' + tag.tagName + '"'

        newButton.innerText = tag.tagName
        const childText = document.createTextNode(" - " + tag.tagName)
        newButton.setAttribute("style","font-size: 20px; transform: translate(0px); position: absolute; left: " + 25 * tag.depth + "px;" + "top: " + buttonSpacing + "px")

        "http://localhost:3000/search/" + '"' + tag.tagName + '"'
        let body = document.getElementById("body")

        hyperLink.appendChild(newButton)
        hyperLink.style.width = "999px"

        body.appendChild(hyperLink)
        body.appendChild(lineBreak)

        fetch("http://localhost:3000/api/tagChildren/" + tag.tagID)
        .then(response => response.json())
        .then(json => {
            if (json.length == 0){
                currentTag++
                nextTag()
                return
            }

            const tagChildren = json

            for (let i = 0; i < tagChildren.length; i++){
                tagChildren[i].depth = tagsToCheck[currentTag].depth + 1
                tagsToCheck.splice(currentTag + 1, 0, tagChildren[i])
                tagsToCheck.join()
                console.log(tagChildren)
            }
            currentTag++
            nextTag()
        })
    }
</script>

<body id = "body" onload = "getParents()" style = "top: 0px;">
    <script src="/navbarScript.js"></script>
    <label style = "font-size: 30px;">Tags</label>
    <br>
</body>

</html>
