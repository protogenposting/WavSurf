<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Tag Browsing Page</title>
</head>

<script defer>

    /* These three arrays should have the same length, especially "tagNames" and "checksIfTagIsChild".
       That way, they can act as pairs for addTagToPage().
       "tagNames" does not need the same length until displayTags() is called. */

    let tagsToBeDisplayed = new Array()
    let tagNames = new Array()
    let checksIfTagIsChild = new Array()

    /**
     * Gets all tags' IDs from the database.
     * Stores the information in the tagsToBeDisplayed array.
     * Calls getTagsToBeDisplayed() and getNames().
     * @returns nothing
    **/
    function getIDs() {
        fetch("http://localhost:3000/api/tagsOrdered")
        .then(response => response.json())
        .then(json => {
            const tags = json

            // Adds a tag's ID for each one in the database. "tags" is sorted alphabetically.
            for (let i = 0; i < tags.length; i++){
                
                getTagsToBeDisplayed(tags[i].tagID)
            }

            getNames()

        });
    }

    /**
     * Gets all of the tags that need to be displayed to the page; includes tags and their children.
     * @param tagID is the tag the function gets tagChildren from.
     * @returns nothing.
    **/
    function getTagsToBeDisplayed(tagID){
        fetch("http://localhost:3000/api/tagChildren/" + tagID)
        .then(response => response.json())
        .then(json => {

            // Always add the next tag.
            tagsToBeDisplayed.push(tagID)
            checksIfTagIsChild.push(false)

            // If the tag has no children, no need to proceed further.
            if (json.length == 0){
                return
            }

            const tagChildren = json

            // Adds all of the tag's children to tagsToBeDisplayed.
            for (let i = 0; i < tagChildren.length; i++){

                tagsToBeDisplayed.push(tagChildren[i].childID)
                checksIfTagIsChild.push(true)

            }
        })
    }

    /**
     * Gets all of the tags' names from tagsToBeDisplayed's IDs and inserts them into tagNames.
     * Needs tagsToBeDisplayed to be initialized before called.
     * Calls displayTags().
     * @returns nothing.
    **/
    function getNames(){
        fetch("http://localhost:3000/api/tagsOrdered")
        .then(response => response.json())
        .then(json => {

            tags = json

            // !!! IMPORTANT !!!
            // Later on, add code so that it only displays 20-50 new tags each time it's called.
            // That way, it's more performance efficient and also loads the webpage faster in general.

            for (let i = 0; i < tagsToBeDisplayed.length; i++){

                // Check for any tag with tagsToBeDisplayed[i]'s current tagID.
                // Once found, add its name to tagNames.

                for (let o = 0; o < tags.length; o++){

                    if (tags[o].tagID == tagsToBeDisplayed[i]){
                        tagNames.push(tags[o].tagName)
                    }

                }
            }

            displayTags()
        })
    }

    /**
     * Displays all of the tags onto the page.
     * Needs "tagNames" and "checksIfTagIsChild" to be initialized before being called.
     * @returns nothing.
    **/
    function displayTags(){

        for (let i = 0; i < tagNames.length; i++){
            addTagToPage(tagNames[i], checksIfTagIsChild[i])
        }
    }

    /**
     * Adds a tag to the page.
     * LATER, EACH TAG SHOULD BE CLICKABLE AND TAKE USER TO SEARCH BAR WITH THE TAG THEY CLICKED ON.
     * 
     * @param tagName is the name of the tag that will show up on the page.
     * @param isChild indents and puts a "-" before the tagName if true. Otherwise, it does nothing.
     * @returns nothing.
    **/
    function addTagToPage(tagName, isChild){

        /* Line break needed so the input buttons stay in a column.
           Button is needed so that the user can go to its page. */
        let lineBreak = document.createElement("br")
        let newButton = document.createElement("button")

        const text = document.createTextNode(tagName)
        const childText = document.createTextNode(" - " + tagName)

        if (isChild) {
            newButton.appendChild(childText)
            newButton.setAttribute("style", "font-size: 20px; position:relative; left: 25px;")
        }
        else {
            newButton.appendChild(text)
            newButton.setAttribute("style", "font-size: 20px;")
        }

        // CHANGE THIS ATTRIBUTE IN THE FUTURE
        //newButton.setAttribute("onclick", goToTagPage(?))

        let body = document.getElementById("body")
        body.appendChild(newButton)
        body.appendChild(lineBreak)
    }        

</script>

<body id = "body" onload = "getIDs()" style = "position:relative; top: 50px; left: 100px; background-color: gray;">
    <label style = "font-size: 30px;">Tags</label>
    <br>
</body>

</html>
