<!DOCTYPE html>
<html lang = "en">
    
<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Post Queue Interface</title>
    <link rel="stylesheet" href="/style.css">
</head>

<script>
    var tagTop = 480;
    function getURLID()
    {
        let endPoint = window.location.href.lastIndexOf("/")

        return window.location.href.slice(endPoint + 1,window.location.href.length)
    }
    function createTagButton(tagID){
        fetch("http://localhost:3000/api/tags/"+tagID)
        .then(response => response.json())
        .then(json => {
            if(json.tagName == undefined)
            {
                return
            }
            //thanks for the code tiger :3
            let lineBreak = document.createElement("br")
            let newButton = document.createElement("button")

            newButton.textContent = json.tagName

            //newButton.setAttribute("onclick", goToTagPage)
            newButton.setAttribute("style", "font-size: 20px; top: "+tagTop+"px;")

            let body = document.getElementById("body")
            body.appendChild(newButton)
            body.appendChild(lineBreak)

            tagTop += 30
        })
    }
    function load()
    {
        let songId = getURLID()

        let embed = document.getElementById("youtube")

        let songData = {}

        fetch("http://localhost:3000/api/post/"+songId)
        .then(response => response.json())
        .then(json => {
            songData = json

            embed.src = "https://www.youtube.com/embed/"+songData.links

            let tags = JSON.parse(songData.tags)

            console.log(tags)

            for(var i = 0; i < tags.length; i++)
            {
                createTagButton(tags[i])
            }
        });
    }
</script>

<body onload="load()" id = "body">
    <iframe
        id = "youtube"
        style = "width: 640px; height: 360px; position:absolute; top: 50px; left: 50%; transform: translate(-50%);"
        src = ""
        title = "HTML &amp; CSS - How to Embed a YouTube Video in Your Website"
        frameborder = "0"
        allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy = "strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe><br>

    <label style = "top: 450px" id = "tags">Tags:</label>

</body>

</html>
