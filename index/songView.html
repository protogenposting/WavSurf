<label>This spot will allow users to see the song's youtube video</label><br>
<label>It should also show the tags of the song below the link / video</label><br>

<body>
    <!--The embed for the actual Youtube video. Replace "src" with a suitable link accordingly.-->
    <iframe
        style = "width: 50%; height: 60%; position:relative; top: 50px; left: 300px"
        src="https://www.youtube.com/embed/ly36kn0ug4k"
        title="HTML &amp; CSS - How to Embed a YouTube Video in Your Website"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>

</body>
