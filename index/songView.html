<!DOCTYPE html>
<html lang = "en">
    
<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Song View</title>
    <link rel="stylesheet" href="/style.css">
</head>

<script defer>
    let offsets = new Array(10)

    offsets = offsets.fill(30,0,offsets.length)

    /**
     * Gets the Youtube video ID from the end of the page's URL and returns it.
    **/
    function getURLID() {
        let endPoint = window.location.href.lastIndexOf("/")

        return window.location.href.slice(endPoint + 1, window.location.href.length)
    }

    /**
     * Creates a tag button for a certain tag and puts it under the Youtube video embed.
     * The tag button is sorted and placed into the "Artist", "Genre", and "Misc" areas respectively.
    **/
    function createTagButton(tagID){
        fetch("http://wavsurf.org/api/tags/" + tagID)
        .then(response => response.json())
        .then(json => {
            if(json.tagName == undefined)
            {
                return
            }
            //thanks for the code tiger :3 // np
            let lineBreak = document.createElement("br")
            let hyperLink = document.createElement("a")
            let newButton = document.createElement("button")

            hyperLink.href = "http://wavsurf.org/search/" + '"' + json.tagName + '"'

            newButton.textContent = json.tagName

            hyperLink.style.width = "999px"

            hyperLink.appendChild(newButton)

            //newButton.setAttribute("onclick", goToTagPage)
            //newButton.setAttribute("style", "font-size: 20px; margin-top: "+offsets[json.type]+"px;")

            let type;

            switch(json.type) {
                case 0:
                    type = "artist"
                    break
                case 1:
                    type = "genre"
                    break
                case 2:
                    type = "misc"
                    break
                default:
                    type = "misc"
            }

            let body = document.getElementById(type)
            body.appendChild(hyperLink)
            body.appendChild(lineBreak)

            //body.style.position = "absolute"
            if(json.type > 0) {
                //body.style.top = (offsets[json.type-1] * 2).toString()+"px"
            }
            //body.style.left = "50%"

            offsets[json.type] += 15
        })
    }

    /**
     * Loads the song's Youtube video embed into the page and posts the song's tags below it.
    **/
    function load() {
        let songId = getURLID()

        let embed = document.getElementById("youtube")

        let songData = {}

        fetch("http://wavsurf.org/api/post/"+songId)
        .then(response => response.json())
        .then(json => {
            songData = json
            document.getElementById("songName").innerText = songData.songName
            embed.src = "https://www.youtube.com/embed/" + songData.link
        });

        fetch("http://wavsurf.org/api/postTags/"+songId)
        .then(response => response.json())
        .then(json => {
            console.log(json)
            for(var i = 0; i < json.length; i++)
            {
                createTagButton(json[i].tagID)
            }
        });
    }
</script>

<body onload = "load()" id = "body">
    <script src="/navbarScript.js"></script>
    <label id="songName" style = "font-size: 40px;">adasds</label>
    <div class = "container">

        <!--The embed for the song's Youtube video. "src" and "title" are initialized during load().-->
        <iframe
            id = "youtube"
            style = "width: 640px; height: 360px; position:absolute; top: 50px; left: 50%; transform: translate(-50%);"
            src = ""
            title = ""
            frameborder = "0"
            allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy = "strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>

    </div>
    <br>

    <div style = "position:absolute; left: 50%; top: 450px; width: 640px; transform: translate(-50%);">

        <!--All of the tags go into one of these three divs.-->

        <div id = "artist" class = "container">
            <label>Artists</label> <br>
        </div> <br>

        <div id = "genre" class = "container">
            <label>Genres</label> <br>
        </div> <br>

        <div id = "misc" class = "container">
            <label>Misc</label> <br>
        </div> <br>

    </div> <br>

</body>

</html>
