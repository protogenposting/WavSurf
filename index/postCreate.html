<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title> Create Post</title>
    <link rel="stylesheet" href="style.css">
</head>

<!--Only available after the page is done loading and has interpreted it.-->
<script defer>

    var spacing = 30;
    var buttonSpacing = 120;
    var buttonSpacing2 = 200;
    var buttonSpacing3 = 60;

    var tagCount = 0

    /**
     * this function submits the data to the server
    */
    function submit() {

        //some setup stuff
        let songName = document.getElementById("songName").value
        let youtubeUrl = document.getElementById("youtubeUrl").value
        let youtubeID

        //check if there is a valid Youtube ID before sending to queue.
        if (youtubeUrl.length == 0) {
            popup.textContent = "Youtube ID or URL is required!"
            popup.style.top = buttonSpacing3+"px";
            return
        }
        else if (youtubeUrl.length < 11) {
            popup.textContent = "Youtube ID is too short! Not 11 digits long!"
            popup.style.top = buttonSpacing3+"px";
            return
        }
        else {
            //gets the last 11 digits of the URL because no matter what format the link is in, the ID is always last
            youtubeID = youtubeUrl.substr(length - 11)
            popup.textContent = "Post added to queue!"
            popup.style.top = buttonSpacing3+"px";
        }
        
        //the tags we got from the page
        let tags = []

        for (let i = 1; i <= tagCount; i++) {
            //add each tag
            let link = document.getElementById("tag" + i.toString()).value

            console.log(i)

            tags.push(link)
        }

        //sent it on over to the post queue
        fetch("http://localhost:3000/api/postQueue", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "authorization": localStorage.getItem("sessionID") //sent authorization to the server so it knows we're logged in
            },
            body: JSON.stringify({
                data: {
                    songName: songName,
                    tags: tags,
                    link: youtubeID
                }
            })
        })
        
    }

    /**
     * Adds another input HTML element below the submit button that allows the user to add another link for the song.
    **/
    function addAnotherInput(){
        tagCount += 1
        spacing += 30;
        buttonSpacing += 30;
        buttonSpacing2 += 30;
        buttonSpacing3 += 30;

        //Line break needed so the input buttons stay in a column
        //Label created so user understands purpose of input
        let lineBreak = document.createElement("br")
        let newLabel = document.createElement("label")

        newLabel.setAttribute("style", "font-size: 20px; top : "+spacing+"px")

        const text = document.createTextNode("Other Link:")
        newLabel.appendChild(text)

        //Create the actual input and set its elements
        let newInput = document.createElement("input")
        const inputID = "tag" + tagCount.toString()

        newInput.setAttribute("type", "text")
        newInput.setAttribute("id", (inputID))
        newInput.setAttribute("name", "data")
        newInput.setAttribute("style", "font-size: 20px; top :"+spacing+"px")
        newInput.setAttribute("list", "autoSuggest")
        newInput.setAttribute("oninput", "getAutoCorrect(this)")

        let div = document.getElementById("buttons")
        let firstButton = document.getElementById("firstButton")
        let secondButton = document.getElementById("secondButton");

        //Adds all three new elements before the Submit and "Add Other Option" button
        div.insertBefore(newLabel, firstButton)
        div.insertBefore(newInput, firstButton)
        firstButton.style.top = buttonSpacing+"px";
        secondButton.style.top = buttonSpacing2+"px";
        
    }
    /**
     * this function gets the auto correct result of the current tag input
    */
    function getAutoCorrect(searchBar) {
        var dataList = document.getElementById("autoSuggest");
        dataList.innerHTML = ""
        fetch("http://localhost:3000/api/tagSimilar/"+searchBar.value, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            }
        })
        .then(response => response.json())
        .then(json => {
            for(var i=0; i<json.length; i++) {
                var newOption = document.createElement("option");
                newOption.value = json[i].tagName;
                dataList.appendChild(newOption);
            }
            searchBar.focus();
        });
    }
</script>

<body id = "body1">
    <div id="inputs">
        <!--User inputs the song's name here.-->
        <label style = "font-size: 20px; left: 570px;">Song name:</label>
        <input
            type = "text"
            id = "songName"
            name = "data"
            style = "font-size: 20px;">
        </input><br>

        <!--User inputs the Youtube URL here.-->
        <label style = "font-size: 20px; left: 540px; top: 30px;">Youtube Link / ID:</label>
        <input
            type = "text"
            id = "youtubeUrl"
            name = "data"
            style = "font-size: 20px; top: 30px;">
        </input><br>

        <label style = "font-size: 20px; left: 540px; top: 60px;">Tag Names:</label>

        <datalist id="autoSuggest">
        </datalist>
    </div>

    <div id = "buttons">
        <!--Includes another option for another parent tag when clicked. Calls addAnotherInput().-->
        <button
            id = "firstButton"
            type = "button";
            style = "height: 75px; width: 200px; font-size: 20px; top : 120px;"
            onclick = "addAnotherInput()">
            Add Tag
        </button>
    
        <!--Attempts to create a post when clicked. Calls submit().-->
        <button
            id = 'secondButton';
            type = "button";
            style = "height: 75px; width: 150px; font-size: 20px; top : 200px;"
            onclick = "submit()">
            Create Post
        </button><br>
    
        <!--Warns the user or tells them post has been created.-->
        <label id = "popup" style = "font-size: 20px;"> </label>
    </div>

</body>



</html>
