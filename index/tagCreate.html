<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>Create Tag</title>
    <link rel="stylesheet" href="style.css">
</head>

<script defer>

    var spacing = 30;
    var buttonSpacing = 120;
    var buttonSpacing2 = 200;
    var buttonSpacing3 = 60;
    var buttonSpacing4 = 50;

    var tagCount = 0

    /**
     * Attempts to submit the user-created tag to the tagQueue.
    **/
    function submit()
    {
        let popup = document.getElementById("popup")
        let parents = []
        let type = -1

        for (let i = 1; i <= tagCount; i++) {
            let info = document.getElementById("tag" + i.toString()).value

            console.log(i)

            parents.push(info)
        }

        switch(document.getElementById("type").value)
        {
            case "Artist": 
                type = 0 
                break;
            case "Genre": 
                type = 1 
                break;
            case "Misc": 
                type = 2
                break;
        }

        fetch("http://localhost:3000/api/tagQueue", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "authorization": localStorage.getItem("sessionID")
            },
            body: JSON.stringify({
                data: {
                    name: document.getElementById("name").value,
                    //parents: JSON.parse(document.getElementById("parents").value),
                    parents: parents,
                    type: type
                }
            })
        }).then((response) => {
            console.log(response.status);
            if (response.status == 401) {
                popup.textContent="Please log in"
                popup.style.top=buttonSpacing4+"px"
            }
        });

    }

    function addAnotherInput(){
        tagCount += 1
        spacing += 30;
        buttonSpacing += 30;
        buttonSpacing2 += 30;
        buttonSpacing3 += 30;
        buttonSpacing4 += 30;

        //Line break needed so the input buttons stay in a column
        //Label created so user understands purpose of input
        let lineBreak = document.createElement("br")

        //Create the actual input and set its elements
        let newInput = document.createElement("input")
        const inputID = "tag" + tagCount.toString()

        newInput.setAttribute("type", "text")
        newInput.setAttribute("id", (inputID))
        newInput.setAttribute("name", "parents")
        newInput.setAttribute("style", "font-size: 20px; top :"+spacing+"px")
        newInput.setAttribute("list", "autoSuggest")
        newInput.setAttribute("oninput", "getAutoCorrect(this)")

        let div = document.getElementById("buttons")
        let addParent = document.getElementById("addParent")
        let submitBtn = document.getElementById("submitBtn");

        //Adds all three new elements before the Submit and "Add Other Option" button
        div.insertBefore(newInput, addParent)
        addParent.style.top = buttonSpacing+"px";
        submitBtn.style.top = buttonSpacing2+"px";
        
    }
    function getAutoCorrect(searchBar) {
        var dataList = document.getElementById("autoSuggest");
        dataList.innerHTML = ""
        fetch("http://localhost:3000/api/tagSimilar/"+searchBar.value, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            }
        })
        .then(response => response.json())
        .then(json => {
            for(var i=0; i<json.length; i++) {
                var newOption = document.createElement("option");
                newOption.value = json[i].tagName;
                dataList.appendChild(newOption);
            }
            searchBar.focus();
        });
    }
</script>

<body>
    <div id="inputs">
        <!--Instructions and inputs for the user.-->
        <label style = "font-size: 20px; left: 570px;">Tag name:</label>
        <input type="text" id="name" name="name" style="font-size: 20px;"><br>

        <label style = "font-size: 20px; left: 480px; top: 30px;">Tag Type (Artist, Genre, Etc.):</label>
        <input type="text" id="type" name="type" style="font-size: 20px; top: 30px;" list = "types"><br>
        <datalist id = "types">
            <option>Artist</option>
            <option>Genre</option>
            <option>Misc</option>
        </datalist>
        <label style="font-size: 20px; left: 570px; top: 60px;">Tag Parents:</label>
        <!--
        <label for="parents">Tag parents (JSON Array with the ids of each tag, change this to something else later)</label><br>
        <input type="text" id="parents" name="parents"><br>
        -->
        <datalist id="autoSuggest">
        </datalist>
    </div>
    <div id="buttons">
        <button id="addParent" type="button" style="top: 120px; height: 75px; width: 150px; font-size: 20px;" onclick="addAnotherInput()">Add Parent</button>

        <!--Submits the information and attempts to send the tag to tagQueue when clicked.-->
        <button id="submitBtn" type="button" style = "top: 200px; height: 75px; width: 150px; font-size: 20px;" onclick="submit()">Submit</button>
    </div>
    
    <a href="http://localhost:3000/login" style="font-size: 20px; width : 999px; "><label id="popup" style = "text-decoration-line: underline;" ></label></a>
    
</body>
</html>
