<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Tag Create</title>
    <link rel="stylesheet" href="style.css">
</head>

<script>
    function submit()
    {
        fetch("http://localhost:3000/api/tagQueue", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "authorization": localStorage.getItem("sessionID")
            },
            body: JSON.stringify({
                data: {
                    name: document.getElementById("name").value,
                    children: JSON.parse(document.getElementById("children").value)
                }
            })
        });

    }
</script>

<body>
    <label for="name">Tag name:</label><br>
    <input type="text" id="name" name="name"><br>
    <label for="children">Tag children (JSON Array with the ids of each tag, change this to something else later)</label><br>
    <input type="text" id="children" name="children"><br>

    <button type="button" onclick="submit()">Submit</button>
</body>
</html>
