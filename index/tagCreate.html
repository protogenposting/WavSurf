<script>
    function submit()
    {
        fetch("http://localhost:3000/api/tagQueue", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                data: document.getElementById("data").value
            })
        });

    }
</script>

<label for="data">Tag json data: (CHANGE TO AN ACTUAL FORM LATER!)</label><br>
<input type="text" id="data" name="data"><br>

<button type="button" onclick="submit()">Click Me!</button>
