<!DOCTYPE html>
<html lang = "en">
<head>
    <link rel="stylesheet" href="style.css">
</head>
<script defer>
    /**
     * Attempts to sign up if possible with given information.
    **/
    function trySignUp() {

        let username = document.getElementById("username").value
        let password = document.getElementById("password").value

        let popup = document.getElementById("popup")
        
        //If username or password are null, warn user and prevent from entering.
        if (username.length === 0 || username === null && password.length === 0 || password === null) {
            popup.textContent = "Please enter a username and a password!"
            return
        }
        else if (username.length === 0 || username === null) {
            popup.textContent = "Please enter a username!"
            return
        }
        else if (password.length === 0 || password === null) {
            popup.textContent = "Please enter a password!"
            return
        }

        //Sends information over to app.js, "Create a sign in session"
        fetch("http://localhost:3000/api/newUser", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    username: username,
                    name: username,
                    password: password
                })
            })
            .then(response => response.text())
            .then(json => {
                console.log(json)

                if(json.indexOf("UNIQUE") > 0)
                {
                    popup.textContent = "YOU NEED A UNIQUE USERNAME"
                }
                else
                {
                    popup.textContent = "account created"
                    popup.style = "color : #000000; font-size: 20px"
                }
            })
    }
</script>

<body>

    <label style = "font-size: 20px;">Username: </label>

    <!--User inputs username here.-->
    <input
        id = "username"
        style = "font-size: 20px;"
        type = "text">
    <br>

    <label style = "font-size: 20px; top: 30px;">Password: </label>

    <!--User inputs password here. Text inputted is hidden in browser.-->
    <input 
        id = "password"
        style = "font-size: 20px; top: 30px;"
        type = "text">
    <br>

    <!--Attempts to sign in when clicked. Calls trySignUp().-->
    <button
        style = "height: 50px; width: 100px; font-size: 20px;"
        type = "button"
        onclick = "trySignUp()">Sign Up</button>
    <br>

    <!--For warning the user.-->
    <popup id = "popup" style = "font-size: 20px;"> </popup>
</body>

</html>
