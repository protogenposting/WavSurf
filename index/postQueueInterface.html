<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>Post Queue Interface</title>
</head>

<script defer>
    // Holds all of the posts from postQueue.
    var queue = [];

    /**
     * Gets all of the posts currently in postQueue.
     * If the user is not a high enough rank or is not logged in
     * they get redirected to the login page.
    **/
    function getInfo() {
        fetch("http://localhost:3000/api/postQueue")
        .then(response => response.json())
        .then(json => {

            console.log(json)

            queue = json;
            document.getElementById('p1').innerHTML = JSON.stringify(json[0]);
            
        });

        if (localStorage.getItem("username") == undefined) {
            window.location.href = "http://localhost:3000/noAccess"
        }
        fetch("http://localhost:3000/api/user/"+localStorage.getItem("username"))
        .then(response => response.json())
        .then(json => {
            if (json.user.rank < 2) {
                window.location.href = "http://localhost:3000/noAccess"
            }
            console.log(json)
            console.log(json.user.rank)
        });
    }

    /**
     * "Accepts" a post by adding it to the posts database.
    **/
    function accept() {
        fetch("http://localhost:3000/api/acceptPost/" + queue[0].id, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "authorization": localStorage.getItem("sessionID")
            },
        })
        .then(getInfo())
        
    }

    /**
     * "Denies" a post by removing it from postQueue permanently.
    **/
    function deny() {
        fetch("http://localhost:3000/api/denyPost/" + queue[0].id, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "authorization": localStorage.getItem("sessionID")
            },
        })
        .then(getInfo())
        
    }
</script>

<!--Runs the getInfo() function when the page is loaded-->
<body onload = "getInfo()"></body>

<!--When clicked runs the accept() function-->
<button type = "button" onclick = "accept()">Accept</button><br>

<!--When clicked runs the deny() function-->
<button type = "button" onclick = "deny()">Deny</button><br>

<!--Displayes the first bit of postQueue data on the page-->
<p id = "p1">placeholder</p>

</html>
