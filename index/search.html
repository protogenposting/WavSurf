<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Search</title>
    <link rel="stylesheet" href="style.css">
</head>



<body>
<input 
    id="searchBar"
    style = "font-size: 20px; width: 700px;"
    type = "text"
    placeholder = 'Song Name "Tag Name"'>
</body><br>
<div id="songs" class = "container" style="position:absolute; left: 50%; top: 200px; width: 640px; transform: translate(-50%);">

</div>
<script>
    /**
     * TEST CASES
     * 
     * test: "Pop"
     * result : Beird, the japanese one
     * 
     * test: "Electronic"
     * result: Ghosts N Stuff, My Heart, Faded, Force, I Remember, Macintosh plus 2k17, Summer Is Over (Fury Weekend Remix), Labyrinth, 宇宙ステーションのレベル7
     * 
     * test: "POOP"
     * result: nothing
     * 
     * test: "Drumstep"
     * result: my heart
    */
    const searchId = document.getElementById("searchBar");
    searchId.onkeydown = function(event) {
        if(event.keyCode == 13) {
            searchMade();
        }
    }
    function searchMade () {
        fetch("http://localhost:3000/api/postSearch", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                search : document.getElementById("searchBar").value,
            })
        })
        .then(response => response.json())
        .then(json => {
            let songs = document.getElementById("songs")
            songs.innerHTML = ""
            for(var i = 0; i < json.length; i++)
            {
                let lineBreak = document.createElement("br")
                let a = document.createElement('a')

                a.textContent = json[i].songName

                a.setAttribute('href', "http://localHost:3000/songView/" + json[i].id)
                a.textContent = json[i].songName

                songs.appendChild(a)
                songs.appendChild(lineBreak)
            }
        });
    
    }
</script>
</html>
