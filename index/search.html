<!DOCTYPE html>
<html lang = "en">

<script>
    var tags = []

    fetch("http://localhost:3000/api/tags")
    .then(response => response.json())
    .then(json => {
        tags = json;
        document.getElementById('tags').innerHTML = JSON.stringify(json);
        console.log(json);
    });

</script>

<body>
    <p id = "tags"></p>
</body>

</html>
