<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Search</title>
    <link rel="stylesheet" href="style.css">
</head>

<script>
    var tags = []

    fetch("http://localhost:3000/api/tags")
    .then(response => response.json())
    .then(json => {
        tags = json;
        document.getElementById('tags').innerHTML = JSON.stringify(json);
        console.log(json);
    });

</script>

<body>
    <p id = "tags"></p>
</body>

</html>
