<!DOCTYPE html>
<html lang = "en">

<!--Head sets up viewport and css-->
<head>
    <meta charset = "UTF-8">
    <meta
        name = "viewport"
        content = "width = device-width, initial-scale = 1"
    >
    <title>WavSurf Search</title>
    <link rel="stylesheet" href="style.css">
</head>

<!--Body contains all the details and front end conent of the page-->
<body>
    <div id="search">
        <input 
            id="searchBar"
            style = "font-size: 20px; width: 700px; left: 400px"
            type = "text"
            placeholder = 'Song Name "Tag Name"'
            list="autoSuggest"
            oninput="getAutoCorrect()">
        <!--Data is present but datalist wont update
        try adding data to a label or other type of content-->
        <datalist id="autoSuggest">
            <option value="test"></option>
        </datalist>
            
    </div>
    <div id = "songs">

    </div>
</body>

<!--Script for the search bar-->
<script>

    //Calls the searchMade method when enter key is pressed
    const searchId = document.getElementById("searchBar");
    searchId.onkeydown = function(event) {
        if(event.keyCode == 13) {
            searchMade();
        }
    }
    /**
     * Makes the search.
     * Searches for the song name if it is provided and tags if they are provided.
     * If the search is a tag it must be contained in quotations "".
     * This method will search for tags if they are provided in quotations.
     * After everything is searched, they will be displayed on the page as links to their songView page.
     */
    function searchMade () {
        fetch("http://localhost:3000/api/postSearch", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                search : document.getElementById("searchBar").value,
            })
        })
        .then(response => response.json())
        .then(json => {
            let songs = document.getElementById("songs")
            let linkSpacing = 50;
            songs.innerHTML = ""
            for(var i = 0; i < json.length; i++)
            {
                let lineBreak = document.createElement("br")
                let hyperLink = document.createElement('a')

                linkSpacing += 50;

                hyperLink.textContent = json[i].songName

                hyperLink.setAttribute('href', "http://localHost:3000/songView/" + json[i].songID)
                hyperLink.textContent = json[i].songName
                hyperLink.style = "left: 75%; font-size: 30px; text-align: center; width: 700px; top:"+linkSpacing+"px";

                songs.appendChild(hyperLink)
                songs.appendChild(lineBreak)
            }
        });
    
    }

    function getSimilarTags(){
        fetch("http://localhost:3000/api/postSearch", {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            }
        })
        .then(response => response.json())
        .then(json => {
            
        });
    }

    function getAutoCorrect() {
        var search = document.getElementById("searchBar").value;
        var tagNames = [];
        var reading = false;
        var currentString = "";
        var dataList = document.getElementById("autoSuggest");

        for (var i=0; i < search.length; i++) {
            var searchChar = search.charAt(i);
            if (searchChar == '"') {
                reading = !reading;
                if (!reading) {
                    currentString = "";
                }
            }else if (reading) {
                currentString = currentString + searchChar;
            }
            console.log(currentString);
        }
        dataList.innerHTML = "";
        if(currentString != ""){
            fetch("http://localhost:3000/api/tagSimilar/"+currentString, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                }
            })
            .then(response => response.json())
            .then(json => {
                for(var i=0; i<json.length; i++) {
                    var newOption = document.createElement("option");
                    newOption.value = '"'+json[i].tagName+'"';
                    dataList.appendChild(newOption);
                    console.log(json[i]);
                }
                document.getElementById("searchBar").focus();
            });
            
        }
    }
</script>
</html>
